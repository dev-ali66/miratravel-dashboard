name: MiraTravel Dashboard CI/CD

on:
  push:
    branches:
      - main

env:
  # ==========================================
  # VPS CONFIGURATION
  # ==========================================
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  VPS_DASHBOARD_PATH: ${{ secrets.VPS_DASHBOARD_PATH }}

  # ==========================================
  # DASHBOARD ENVIRONMENT
  # ==========================================
  VITE_API_URL: ${{ secrets.VITE_API_URL }}
  VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}


jobs:

  # ==========================================
  # BUILD DASHBOARD
  # ==========================================
  build:
    name: Build Dashboard
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # CHECKOUT
      # ========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================
      # SETUP NODE
      # ========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ========================================
      # CREATE PRODUCTION ENVIRONMENT
      # ========================================
      - name: Create production environment
        run: |
          printf '%s\n' \
            "VITE_API_URL=${VITE_API_URL}" \
            "VITE_SOCKET_URL=${VITE_SOCKET_URL}" \
            > .env.production

          echo "=== Production environment created ==="

      # ========================================
      # INSTALL DEPENDENCIES
      # ========================================
      - name: Install dependencies
        run: npm ci

      # ========================================
      # BUILD DASHBOARD
      # ========================================
      - name: Build Dashboard
        run: npm run build

      # ========================================
      # VERIFY BUILD
      # ========================================
      - name: Verify build
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found!"
            exit 1
          fi

          echo "======================================"
          echo "   Dashboard build successful"
          echo "======================================"

          ls -lah dist

      # ========================================
      # PACKAGE ONLY DIST
      # ========================================
      - name: Package dist
        run: |
          cd dist
          zip -r ../dashboard-dist.zip .

          echo "=== Dashboard package created ==="
          ls -lh ../dashboard-dist.zip

      # ========================================
      # UPLOAD ARTIFACT
      # ========================================
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard-dist.zip
          retention-days: 1


  # ==========================================
  # DEPLOY DASHBOARD
  # ==========================================
  deploy:
    name: Deploy Dashboard to Hostinger
    needs: build
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # DOWNLOAD BUILD ARTIFACT
      # ========================================
      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist

      # ========================================
      # VERIFY DASHBOARD PATH SECRET
      # ========================================
      - name: Verify dashboard path
        run: |
          if [ -z "${VPS_DASHBOARD_PATH}" ]; then
            echo "ERROR: VPS_DASHBOARD_PATH secret is empty or missing!"
            exit 1
          fi

          echo "Dashboard deployment path is configured."

      # ========================================
      # PREPARE VPS DIRECTORY
      # ========================================
      - name: Prepare dashboard directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}

          script: |
            set -e

            DASHBOARD_PATH="${{ secrets.VPS_DASHBOARD_PATH }}"

            echo "======================================"
            echo "   Preparing Dashboard Directory"
            echo "======================================"

            if [ -z "$DASHBOARD_PATH" ]; then
              echo "ERROR: VPS_DASHBOARD_PATH is empty!"
              exit 1
            fi

            echo "Creating dashboard directory..."

            mkdir -p "$DASHBOARD_PATH"

            echo "Dashboard directory ready:"
            echo "$DASHBOARD_PATH"

      # ========================================
      # UPLOAD BUILD ZIP TO VPS
      # ========================================
      - name: Upload dashboard build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          source: "dashboard-dist.zip"
          target: ${{ secrets.VPS_DASHBOARD_PATH }}

      # ========================================
      # DEPLOY DASHBOARD
      # ========================================
      - name: Deploy Dashboard
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}

          script: |
            set -e

            DASHBOARD_PATH="${{ secrets.VPS_DASHBOARD_PATH }}"

            echo "======================================"
            echo "       Dashboard Deployment"
            echo "======================================"

            # ------------------------------------
            # VERIFY PATH
            # ------------------------------------
            if [ -z "$DASHBOARD_PATH" ]; then
              echo "ERROR: VPS_DASHBOARD_PATH is empty!"
              exit 1
            fi

            echo "Dashboard path:"
            echo "$DASHBOARD_PATH"

            # ------------------------------------
            # ENTER DASHBOARD DIRECTORY
            # ------------------------------------
            cd "$DASHBOARD_PATH"

            # ------------------------------------
            # VERIFY ZIP
            # ------------------------------------
            if [ ! -f "dashboard-dist.zip" ]; then
              echo "ERROR: dashboard-dist.zip not found!"
              exit 1
            fi

            echo "=== Build ZIP found ==="
            ls -lh dashboard-dist.zip

            # ------------------------------------
            # CLEAN OLD DASHBOARD FILES
            # ------------------------------------
            echo "=== Cleaning old dashboard files ==="

            find "$DASHBOARD_PATH" \
              -mindepth 1 \
              -maxdepth 1 \
              ! -name "dashboard-dist.zip" \
              -exec rm -rf {} +

            # ------------------------------------
            # EXTRACT NEW BUILD
            # ------------------------------------
            echo "=== Extracting new dashboard build ==="

            unzip -o dashboard-dist.zip

            # ------------------------------------
            # REMOVE ZIP
            # ------------------------------------
            echo "=== Removing deployment ZIP ==="

            rm -f dashboard-dist.zip

            # ------------------------------------
            # VERIFY DEPLOYMENT
            # ------------------------------------
            echo "=== Verifying deployed files ==="

            if [ ! -f "$DASHBOARD_PATH/index.html" ]; then
              echo "ERROR: index.html not found after deployment!"
              exit 1
            fi

            # ------------------------------------
            # SHOW DEPLOYED FILES
            # ------------------------------------
            echo "==== Dashboard files ===="

            ls -lah "$DASHBOARD_PATH"

            echo "======================================"
            echo "✓ Dashboard deployment successful"
            echo "======================================"

      - name: Delete deployment artifact from GitHub Actions
        uses: geekyeggo/delete-artifact@v5
        if: always()
        with:
          name: dashboard-dist
