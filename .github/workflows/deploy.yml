name: MiraTravel Dashboard CI/CD

on:
  push:
    branches:
      - main

env:
  # ==========================================
  # VPS CONFIGURATION
  # ==========================================
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  VPS_DASHBOARD_PATH: ${{ secrets.VPS_DASHBOARD_PATH }}

  # ==========================================
  # DASHBOARD ENVIRONMENT
  # ==========================================
  VITE_API_URL: ${{ secrets.VITE_API_URL }}
  VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}

jobs:

  # ==========================================
  # BUILD
  # ==========================================
  build:
    name: Build Dashboard
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create production environment
        run: |
          printf '%s\n' \
            "VITE_API_URL=${VITE_API_URL}" \
            "VITE_SOCKET_URL=${VITE_SOCKET_URL}" \
            > .env.production

      - name: Install dependencies
        run: npm ci

      - name: Build Dashboard
        run: npm run build

      - name: Verify build
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found!"
            exit 1
          fi

          echo "=== Dashboard build successful ==="
          ls -lah dist

      # ========================================
      # PACKAGE ONLY DIST
      # ========================================
      - name: Package dist
        run: |
          cd dist
          zip -r ../dashboard-dist.zip .

      # ========================================
      # UPLOAD ARTIFACT
      # ========================================
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard-dist.zip


  # ==========================================
  # DEPLOY
  # ==========================================
  deploy:
    name: Deploy Dashboard to Hostinger
    needs: build
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # DOWNLOAD BUILD
      # ========================================
      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist

      # ========================================
      # PREPARE VPS DIRECTORY
      # ========================================
      - name: Prepare dashboard directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "   Preparing Dashboard Directory"
            echo "======================================"

            mkdir -p "${VPS_DASHBOARD_PATH}"

      # ========================================
      # UPLOAD ONLY BUILD ZIP
      # ========================================
      - name: Upload dashboard build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          source: "dashboard-dist.zip"
          target: ${{ env.VPS_DASHBOARD_PATH }}

      # ========================================
      # EXTRACT BUILD
      # ========================================
      - name: Deploy Dashboard
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}

          script: |
            set -e

            PROJECT_PATH="${VPS_DASHBOARD_PATH}"

            echo "======================================"
            echo "       Dashboard Deployment"
            echo "======================================"

            cd "$PROJECT_PATH"

            echo "=== Cleaning old dashboard files ==="

            find "$PROJECT_PATH" \
              -mindepth 1 \
              -maxdepth 1 \
              ! -name "dashboard-dist.zip" \
              -exec rm -rf {} +

            echo "=== Extracting new dashboard build ==="

            unzip -o dashboard-dist.zip

            rm -f dashboard-dist.zip

            echo "=== Verifying deployed files ==="

            if [ ! -f "index.html" ]; then
              echo "ERROR: index.html not found!"
              exit 1
            fi

            echo "=== Dashboard files ==="
            ls -lah "$PROJECT_PATH"

            echo "======================================"
            echo "✓ Dashboard deployment successful"
            echo "======================================"